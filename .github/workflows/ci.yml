name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict --verbose=2 dist/K3BatteryBar.app
