name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Import Developer ID certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$certificate_path" \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          security list-keychains \
            -d user \
            -s build.keychain \
            "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning build.keychain

      - name: Test
        run: swift test

      - name: Build app
        run: |
          if [[ -n "$BUILD_CERTIFICATE_BASE64" ]]; then
            export CODE_SIGN_IDENTITY="Developer ID Application"
          fi
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          export APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          ./scripts/build-app.sh

      - name: Notarize app
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          ditto -c -k --keepParent \
            dist/K3BatteryBar.app \
            "$RUNNER_TEMP/K3BatteryBar-notarization.zip"
          xcrun notarytool submit \
            "$RUNNER_TEMP/K3BatteryBar-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/K3BatteryBar.app
          xcrun stapler validate dist/K3BatteryBar.app

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 dist/K3BatteryBar.app
          spctl --assess --type execute --verbose=2 dist/K3BatteryBar.app || true

      - name: Create release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/K3BatteryBar.app \
            "$RUNNER_TEMP/K3BatteryBar-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/K3BatteryBar-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$archive" \
              --title "K3BatteryBar $GITHUB_REF_NAME" \
              --generate-notes
          fi
